<!DOCTYPE html>
<html>
<head>
  <title>Music Library</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial;
      .header {
  font-size: 26px;
  font-weight: 700;
  padding: 20px 20px 0 20px;
    }

    /* LIBRARY GRID */
    .library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .album {
      cursor: pointer;
    }

    .album img {
      width: 100%;
      border-radius: 12px;
      display: block;
    }

    .album-title {
      margin-top: 6px;
      font-size: 14px;
    }

    /* PLAYER */
    .player {
      display: none;
      padding: 20px;
      text-align: center;
    }

    .cover {
      width: 220px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .song {
      margin: 10px 0;
      cursor: pointer;
      opacity: 0.7;
    }

    .song:hover {
      opacity: 1;
    }

    .active {
      opacity: 1;
      text-decoration: underline;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
      background: #1f1f1f;
      border: none;
      border-radius: 6px;
      color: white;
    }
  </style>
</head>

<body>

<!-- LIBRARY -->
<div class="header">Kanye Unreleased</div>
<div id="library" class="library"></div>

<!-- PLAYER -->
<div id="player" class="player">

  <button onclick="goBack()">← Back</button>

  <h2 id="albumTitle"></h2>
  <img id="cover" class="cover">

  <h3 id="title">Select a song</h3>
  <p id="artist"></p>

  <audio id="audio"></audio>

  <div id="songs"></div>

</div>

<script>

// --------------------
// YOUR ALBUMS
// --------------------
const albums = [
  {
    name: "Good Ass Job",
    cover: "goodasscover.jpg",
    songs: [
      { file: "seemenow.mp3", title: "See Me Now", artist: "Kanye West (feat. Beyoncé, Charlie Wilson, Big Sean)" },
      { file: "dontlookdown.mp3", title: "Don't Look Down", artist: "Kanye West (feat. Mos Def, Lupe Fiasco, Big Sean)" },
      { file: "throwmoneyeverywhere.mp3", title: "Throw Money Everywhere", artist: "Kanye West" },
      { file: "mamasboyfriends.mp3", title: "Mama's Boyfriends", artist: "Kanye West" },
    ]
  },

  {
    name: "Second Album",
    cover: "cover2.jpg",
    songs: [
      { file: "song5.mp3", title: "Song A", artist: "Artist A" },
      { file: "song6.mp3", title: "Song B", artist: "Artist B" }
    ]
  }
];

// --------------------
// VARIABLES
// --------------------
let currentAlbum = null;
let currentSong = 0;

const library = document.getElementById("library");
const player = document.getElementById("player");
const audio = document.getElementById("audio");

// --------------------
// BUILD LIBRARY
// --------------------
albums.forEach((album, i) => {
  const div = document.createElement("div");
  div.className = "album";

  div.innerHTML = `
    <img src="${album.cover}">
    <div class="album-title">${album.name}</div>
  `;

  div.onclick = () => openAlbum(i);
  library.appendChild(div);
});

// --------------------
// OPEN ALBUM
// --------------------
function openAlbum(i) {
  currentAlbum = albums[i];

  library.style.display = "none";
  player.style.display = "block";

  loadAlbumIntoPlayer(currentAlbum);
}
  function loadAlbumIntoPlayer(album) {
  document.getElementById("albumTitle").innerText = album.name;
  document.getElementById("cover").src = album.cover;

  buildSongs(album.songs);
}
  function buildSongs(songs) {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";
    div.innerText = song.title;

    div.onclick = () => playSong(song, songs);
    songsDiv.appendChild(div);
  });
}
  function playSong(song, playlist) {
  currentPlaylist = playlist;
  currentIndex = playlist.indexOf(song);

  audio.src = song.file;
  document.getElementById("title").innerText = song.title;
  document.getElementById("artist").innerText = song.artist;

  audio.play();
}
// --------------------
// BUILD SONG LIST
// --------------------
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";
    div.innerText = song.title;

    div.onclick = () => playSong(i);
    songsDiv.appendChild(div);
  });
}

// --------------------
// PLAY SONG
// --------------------
function playSong(i) {
  currentSong = i;

  const song = currentAlbum.songs[i];

  audio.src = song.file;
  document.getElementById("title").innerText = song.title;
  document.getElementById("artist").innerText = song.artist;

  audio.play();

  highlight(i);
}

// --------------------
// HIGHLIGHT CURRENT SONG
// --------------------
function highlight(i) {
  const songs = document.querySelectorAll(".song");
  songs.forEach(s => s.classList.remove("active"));
  if (songs[i]) songs[i].classList.add("active");
}

// --------------------
// BACK BUTTON
// --------------------
function goBack() {
  player.style.display = "none";
  library.style.display = "grid";
  audio.pause();
}

</script>

</body>
</html>
