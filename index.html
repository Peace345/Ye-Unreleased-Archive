<!DOCTYPE html>
<html>
<head>
  <title>Music Library</title>

  <style>
    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial;
    }

    /* LIBRARY */
    .library {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .album {
      cursor: pointer;
    }

    .album img {
      width: 100%;
      border-radius: 12px;
    }

    .album-title {
      margin-top: 6px;
      font-size: 14px;
    }

    /* PLAYER */
    .player {
      display: none;
      padding: 20px;
    }

    .cover {
      width: 220px;
      border-radius: 12px;
    }

    .song {
      margin: 10px 0;
      cursor: pointer;
      opacity: 0.7;
    }

    .song:hover {
      opacity: 1;
    }

    .active {
      opacity: 1;
      text-decoration: underline;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      cursor: pointer;
      background: #1f1f1f;
      border: none;
      border-radius: 6px;
      color: white;
    }

    .nowPlaying {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      padding: 10px;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- LIBRARY -->
<div id="library" class="library"></div>

<!-- PLAYER -->
<div id="player" class="player">

  <button onclick="goBack()">← Back</button>

  <h2 id="albumTitle"></h2>
  <img id="cover" class="cover">

  <h3 id="title">Select a song</h3>
  <p id="artist"></p>

  <audio id="audio"></audio>

  <div id="songs"></div>

</div>

<div class="nowPlaying" id="nowPlaying">Nothing playing</div>

<script>

const audio = document.getElementById("audio");
const library = document.getElementById("library");
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

let currentAlbum = null;
let currentIndex = 0;

// --------------------
// YOUR ALBUMS
// --------------------
const albums = [
  {
    name: "Graduation",
    cover: "graduation.jpg",
    songs: [
      { file: "buildings.mp3", title: "Buildings", artist: "Kanye West (feat. Jay-Z)" },
      { file: "passenger.mp3", title: "Passenger", artist: "Kanye West" }
    ]
  },
  
  {
    name: "Good Ass Job",
    cover: "goodasscover.jpg",
    songs: [
      { file: "seemenow.mp3", title: "See Me Now", artist: "Kanye West (feat. Beyoncé, Charlie Wilson, and Big Sean)" },
      { file: "christiandiordenimflow.mp3", title: "Christian Dior Denim Flow", artist: "Kanye West (feat. Kid Cudi, Pusha T, John Legend, Lloyd Banks, and Ryan Leslie)" },
      { file: "mamasboyfriends.mp3", title: "Mamas Boyfriends", artist: "Kanye West" }
    ]
  },

  {
    name: "Child Rebel Soldier",
    cover: "childrebelsoldiercover.jpg",
    songs: [
      { file: "childrebelsoldier.mp3", title: "Child Rebel Soldier", artist: "Kanye West, Lupe Fiasco, Pharrell Williams" },
      { file: "backbypopulardemand.mp3", title: "Back By Popular Demand", artist: "Kanye West, Lupe Fiasco, Pharrell Williams" }
    ]
  },

  {
    name: "Thank God For Drugs",
    cover: "tgfdcover.jpg",
    songs: [
      { file: "iamnothome.mp3", title: "I Am Not Home", artist: "Kanye West" },
      { file: "awesome.mp3", title: "Awesome", artist: "Kanye West" },
      { file: "hollywood.mp3", title: "Hollywood", artist: "Kanye West (feat. Justxn Paul)" }
    ]
  },

  {
    name: "So Help Me God",
    cover: "sohelpmegod.jpg",
    songs: [
      { file: "alldayog.mp3", title: "All Day (OG)", artist: "Kanye West (feat. Kendrick Lamar)" },
      { file: "howyoufeeling.mp3", title: "How You Feeling", artist: "Kanye West" }
    ]
  },

  {
    name: "JESUS IS KING II",
    cover: "jesusiskingiicover.jpg",
    songs: [
      { file: "thisistheglory.mp3", title: "This Is The Glory", artist: "Kanye West (feat. Snoop Dogg)" },
      { file: "wakethedead.mp3", title: "Wake The Dead", artist: "Kanye West" }
    ]
  },
  
  {
    name: "CUCK",
    cover: "cuckcover.jpg",
    songs: [
      { file: "ww3.mp3", title: "WW3", artist: "Kanye West" },
       { file: "gaschambers.mp3", title: "GAS CHAMBERS", artist: "Kanye West" },
      { file: "nitrous.mp3", title: "NITROUS", artist: "Kanye West" }
    ]
  }
];

// --------------------
// BUILD LIBRARY
// --------------------
albums.forEach((album, i) => {
  const div = document.createElement("div");
  div.className = "album";

  div.innerHTML = `
    <img src="${album.cover}">
    <div class="album-title">${album.name}</div>
  `;

  div.onclick = () => openAlbum(i);
  library.appendChild(div);
});

// --------------------
// OPEN ALBUM (NO AUTO PLAY)
// --------------------
function openAlbum(i) {
  currentAlbum = albums[i];

  library.style.display = "none";
  player.style.display = "block";

  document.getElementById("albumTitle").innerText = currentAlbum.name;
  document.getElementById("cover").src = currentAlbum.cover;

  buildSongs();
}

// --------------------
// BUILD SONG LIST
// --------------------
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {
    const div = document.createElement("div");
    div.className = "song";
    div.innerText = song.title;

    div.onclick = () => playSong(i);
    songsDiv.appendChild(div);
  });
}

// --------------------
// PLAY SONG
// --------------------
function playSong(i) {
  currentIndex = i;

  const song = currentAlbum.songs[i];

  audio.src = song.file;
  document.getElementById("title").innerText = song.title;
  document.getElementById("artist").innerText = song.artist;

  audio.play();

  nowPlaying.innerText = `Now Playing: ${song.title} — ${song.artist}`;

  highlight(i);

  updateMediaSession(song);
}

// --------------------
// HIGHLIGHT SONG
// --------------------
function highlight(i) {
  const songs = document.querySelectorAll(".song");
  songs.forEach(s => s.classList.remove("active"));
  if (songs[i]) songs[i].classList.add("active");
}

// --------------------
// NEXT SONG (AUTO)
// --------------------
audio.addEventListener("ended", () => {
  if (!currentAlbum) return;

  currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
  playSong(currentIndex);
});

// --------------------
// BACK TO LIBRARY
// --------------------
function goBack() {
  player.style.display = "none";
  library.style.display = "grid";
  audio.pause();
  nowPlaying.innerText = "Nothing playing";
}
  function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

</script>

</body>
</html>
